<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="towerFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3138" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1d22" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="towerSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2329" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#14171c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A8550" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c4b896" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9A8550" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1a1c1e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Right face (darker) -->
    <path d="M260 120 L380 200 L380 480 L260 400 Z" fill="url(#towerSide)"/>
    <!-- Front face -->
    <path d="M80 120 L260 120 L260 400 L80 480 Z" fill="url(#towerFace)"/>
    <!-- Roof plane -->
    <path d="M80 120 L200 40 L320 40 L260 120 Z" fill="#252a32" fill-opacity="0.94"/>
    <path d="M260 120 L320 40 L400 120 L380 200 Z" fill="#1e2228" fill-opacity="0.9"/>
    <!-- Vertical glass bands (front) -->
    <rect x="100" y="150" width="28" height="230" rx="1" fill="url(#glass)" fill-opacity="0.35"/>
    <rect x="145" y="150" width="28" height="230" rx="1" fill="url(#glass)" fill-opacity="0.28"/>
    <rect x="190" y="150" width="28" height="230" rx="1" fill="url(#glass)" fill-opacity="0.32"/>
    <!-- Crown highlight -->
    <path d="M200 40 L320 40 L260 120 L80 120 Z" fill="url(#glass)" fill-opacity="0.15"/>
  </g>
</svg>
